name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BERN_VERSION: "0.3.2"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate release metadata
        run: python scripts/release.py validate
      - name: Install development libraries
        timeout-minutes: 10
        run: bash scripts/install_linux_dependencies.sh core
      - name: Install pinned Rust and check tools
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-${{ runner.os }}-
      - name: Install Bern CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bern-cli"
          curl -fsSL "https://github.com/AimesSoft/Bern/releases/download/v${BERN_VERSION}/bern-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$RUNNER_TEMP/bern-cli"
          echo "$RUNNER_TEMP/bern-cli" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bern-cli/bern" --version
      - run: cargo fmt -p rustsend-engine -p rustsend-protocol -p rustsend-ui --check
      - run: cargo clippy --locked -p rustsend-engine -p rustsend-protocol -p rustsend-ui --all-targets --no-deps -- -D warnings
      - run: cargo test --locked -p rustsend-engine -p rustsend-protocol -p rustsend-ui
      - name: Validate all UI targets with Bern
        run: bern check
