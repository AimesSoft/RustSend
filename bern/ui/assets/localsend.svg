<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
<!-- Original LocalSend artwork (Apache-2.0), tinted Rust orange.
     Match RotatingWidget: clockwise, linear, one turn every 15 seconds. -->
<style>
  .ink { fill: #CE422B; }
  .turn { transform-origin: 256px 256px; animation: spin 15s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .turn { animation: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<defs><mask id="logo" mask-type="alpha" x="0" y="0" width="512" height="512"><image width="512" height="512" xlink:href="data:image/png;base64,"/></mask></defs>
<g class="turn"><rect class="ink" width="512" height="512" mask="url(#logo)"/></g>
</svg>
